name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 10406996
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      
      - name: Cache Export Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.3-${{ runner.os }}
      
      - name: Install Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cd ~/.local/share/godot/export_templates/4.3.stable
          
          # تحميل مع إعادة المحاولة
          wget --tries=3 --timeout=120 --progress=dot:giga \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O templates.tpz
          
          # فك الضغط
          unzip -oq templates.tpz
          mv templates/* .
          rm -rf templates templates.tpz
          
          echo "✅ Templates installed:"
          ls -la
      
      - name: Verify Templates
        run: |
          ls -la ~/.local/share/godot/export_templates/4.3.stable/
          test -f ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -f ~/.local/share/godot/export_templates/4.3.stable/android_release.apk
      
      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" "build/android.apk"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/*.apk
concurrency:
  
