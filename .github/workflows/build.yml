name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: 4.3.0
        use-dotnet: false
        
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Export Templates
      run: |
        EXPORT_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
        mkdir -p "$EXPORT_DIR"
        cd "$EXPORT_DIR"
        wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
        unzip -q Godot_v4.3-stable_export_templates.tpz
        mv templates/* .
        rm -rf templates *.tpz
        chmod +x android_*.apk 2>/dev/null || true
        
    - name: Verify Templates
      run: |
        ls -la ~/.local/share/godot/export_templates/4.3.stable/
        test -f ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk
        test -f ~/.local/share/godot/export_templates/4.3.stable/android_release.apk
        
    - name: Build Android APK
      run: |
        godot --headless --export-release "Android" build/android.apk 2>&1 | tee build.log
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/android.apk
