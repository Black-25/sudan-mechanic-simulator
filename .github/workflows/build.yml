name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Export Templates
        shell: bash
        run: |
          set -euo pipefail
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$T" /tmp/tpl
          wget -q --tries=3 --timeout=120 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/tpl/t.tpz
          unzip -oq /tmp/tpl/t.tpz -d /tmp/tpl/out
          cp -r /tmp/tpl/out/templates/. "$T"/
          ls "$T"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM="$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          S=$(printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME")
          echo "$S" > ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Write export preset
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^config\/icon=/d' project.godot
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/SudanMechanicSimulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.sudanmechanic.simulator"
          package/name="Sudan Mechanic Simulator"
          package/signed=true
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          screen/immersive_mode=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF
          sed -i 's/^          //' export_presets.cfg

      - name: Export APK
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          godot --headless --path . --import
          godot --headless --verbose --path . --export-debug "Android" build/SudanMechanicSimulator.apk 2>&1 | tee export.log || {
            echo "=== last log ==="
            tail -60 export.log
            exit 1
          }
          ls -lh build/SudanMechanicSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SudanMechanicSimulator-APK
          path: build/SudanMechanicSimulator.apk
