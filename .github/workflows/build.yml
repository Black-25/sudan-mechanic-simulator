name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Export Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.3

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates/unpacked
          wget --tries=3 --timeout=120 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/godot-templates/templates.tpz
          unzip -oq /tmp/godot-templates/templates.tpz -d /tmp/godot-templates/unpacked
          cp -r /tmp/godot-templates/unpacked/templates/. "$TEMPLATE_DIR"/
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          test -s "$TEMPLATE_DIR/version.txt"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)"
          fi

          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME" > ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Export APK
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/SudanMechanicSimulator.apk 2>&1 | tee export.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/SudanMechanicSimulator.apk
