name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Export Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.3

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot-templates/unpacked

          wget --tries=3 --timeout=120 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/godot-templates/templates.tpz

          unzip -oq /tmp/godot-templates/templates.tpz \
            -d /tmp/godot-templates/unpacked

          SRC_DIR="/tmp/godot-templates/unpacked/templates"
          if [ ! -d "$SRC_DIR" ]; then
            echo "ERROR: templates folder not found."
            find /tmp/godot-templates/unpacked -maxdepth 2 -print
            exit 1
          fi

          cp -r "$SRC_DIR"/. "$TEMPLATE_DIR"/

          for f in android_debug.apk android_release.apk version.txt; do
            if [ ! -s "$TEMPLATE_DIR/$f" ]; then
              echo "ERROR: missing $f"
              ls -lh "$TEMPLATE_DIR"
              exit 1
            fi
          done

          echo "Templates installed."
