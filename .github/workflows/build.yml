name: Build SUDAN MECHANIC SIMULATOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      GODOT_VERSION: 4.3.0
      GODOT_RELEASE: 4.3-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip wget
          # إصلاح: تحديد JAVA_HOME بشكل صريح
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # إصلاح: إضافة cmdline-tools-version إلزامي
          cmdline-tools-version: 11076708
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Download Godot
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          # إصلاح: إنشاء المجلد بالمسار الصحيح
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_RELEASE}"
          mkdir -p "$TEMPLATES_DIR"
          
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O templates.tpz
          unzip -q templates.tpz -d templates-unpacked
          cp -a templates-unpacked/templates/. "$TEMPLATES_DIR/"
          
          # التحقق من نجاح التثبيت
          ls -la "$TEMPLATES_DIR/android/" || echo "Warning: Android templates not found"

      - name: Check project files
        run: |
          set -eu
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scenes/player.tscn
          test -f scenes/workshop.tscn
          test -f scripts/game_manager.gd
          test -f scripts/player.gd
          test -f scripts/camera_controller.gd
          test -f scripts/mobile_controls.gd
          test -f scripts/save_system.gd

      - name: Create debug keystore
        run: |
          # إصلاح: إنشاء المجلد أولاً واستخدام المسار القياسي
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          
          # إضافة متغيرات البيئة للـ Android SDK
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Import project resources
        run: |
          # إصلاح: إضافة --import لاستيراد الموارد بشكل صحيح
          godot --headless --editor --path . --quit --import

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/SudanMechanicSimulator.apk

      - name: Verify APK
        run: |
          test -s build/SudanMechanicSimulator.apk
          ls -lh build/SudanMechanicSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudan-Mechanic-Simulator-APK
          path: build/SudanMechanicSimulator.apk
          if-no-files-found: error
          retention-days: 14
